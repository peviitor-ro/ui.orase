<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Orase Romania</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="heading">
        <div class="logo">
          <a
            href="https://peviitor.ro/"
            target="_blank"
            rel="noopener"
            aria-label="Pe Viitor"
          >
            <img src="assets/peviitor.svg" alt="PE VIITOR" />
          </a>
        </div>
        <div class="flag">
          <div class="b"></div>
          <div class="y"></div>
          <div class="r"></div>
        </div>
      </div>
      <div class="api-container">
        <h1>Caută orașe din România</h1>
        <div class="input-container">
          <input
            id="api-search"
            name="api-search"
            type="search"
            placeholder="Caută un județ sau o localitate"
            aria-label="Caută un județ sau o localitate"
            autocomplete="off"
          />
          <div id="api-tags" class="tags"></div>
          <div id="api-select" name="api-select" type="select"></div>
        </div>
        <div class="doc-container">
          <div id="json-example" class="json">
            <div class="code-container">
              <div class="code-header">
                <div class="code-tabs" role="tablist">
                  <button
                    type="button"
                    class="code-tab active"
                    data-lang="javascript"
                  >
                    JavaScript
                  </button>
                  <button type="button" class="code-tab" data-lang="curl">
                    cURL
                  </button>
                  <button type="button" class="code-tab" data-lang="python">
                    Python
                  </button>
                  <button type="button" class="code-tab" data-lang="php">
                    PHP
                  </button>
                  <button type="button" class="code-tab" data-lang="json">
                    JSON Preview
                  </button>
                </div>
                <button
                  type="button"
                  class="copy-button"
                  id="copy-code-btn"
                  data-tooltip="Copy code"
                  aria-label="Copy code"
                >
                  <ion-icon name="copy-outline"></ion-icon>
                </button>
              </div>
              <div class="code-meta">
                <span class="code-method">GET</span>
                <span class="code-desc-badge" id="code-snippet-desc"
                  >Toate județele</span
                >
              </div>
              <pre class="code-pre"><code id="code-display"></code></pre>
            </div>
          </div>
        </div>
      </div>
      <footer class="app-footer">
        <div class="footer-links">
          <a
            href="https://oportunitatisicariere.ro"
            target="_blank"
            rel="noopener"
            >oportunitatisicariere.ro</a
          >
          <span class="divider">·</span>
          <a href="https://peviitor.ro" target="_blank" rel="noopener"
            >peviitor.ro</a
          >
          <span class="divider">·</span>
          <a
            href="https://discord.gg/oportunitati-si-cariere"
            target="_blank"
            rel="noopener"
            >Discord</a
          >
        </div>
        <div class="footer-copy">
          &copy; 2026 Asociația Oportunități și Cariere. Toate drepturile
          rezervate.
        </div>
      </footer>
    </div>
  </body>
</html>

<script
  type="module"
  src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
></script>
<script
  nomodule
  src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
></script>

<script type="module" src="scripts/main.js"></script>
